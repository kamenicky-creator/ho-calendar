<style>
/* Farby a písma podľa vizuálnej identity PLG / Ticketportal (Logo Manual 2026). */
:root{
  color-scheme: dark;
  --dp:#11002D; --pu:#413357; --gr:#06D473; --pk:#FF80E3; --cd:#2A1A45; --wh:#FFFFFF; --lv:#DBD7E2; --md:#C9C2D6;
  --font-h:"Bricolage Grotesque","Arial Black",Arial,sans-serif;
  --font:"Mulish",Arial,Helvetica,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--gr);
}
*,*::before,*::after{box-sizing:inherit}
html,body{min-height:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--gr);color:var(--wh);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-top:10px}
.panel{flex:1;display:flex;flex-direction:column;background:radial-gradient(ellipse 60% 80% at 96% 110%,rgba(6,212,115,.28),rgba(6,212,115,0) 70%),var(--dp);border-radius:clamp(22px,3.2vw,44px) clamp(22px,3.2vw,44px) 0 0}
.wrap{flex:1;display:flex;flex-direction:column;width:100%;max-width:1320px;margin:0 auto;padding:clamp(24px,4vw,44px) clamp(20px,5vw,64px) clamp(20px,3vw,32px);position:relative}

.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:center}
.eyebrow{display:inline-block;margin:0 0 18px;padding:.3em .85em;border-radius:999px;background:var(--gr);color:var(--dp);font-family:var(--font-h);font-size:.8125rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
h1{margin:0;font-family:var(--font-h);font-size:clamp(2.8rem,7.5vw,5.75rem);font-weight:800;line-height:1;letter-spacing:-.02em;max-width:11ch}
h1 em{font-style:normal;color:var(--gr)}
.sub{margin:18px 0 34px;color:var(--md);font-size:1.125rem;max-width:44ch}
form{max-width:30rem}
label{display:block;font-weight:700;margin-bottom:8px}
.row{display:flex;gap:8px}
input[type=password]{flex:1;min-width:0;height:50px;border:0;border-radius:999px;background:var(--cd);color:var(--wh);font:inherit;font-size:1rem;padding:0 20px;box-shadow:inset 0 0 0 1px var(--pu)}
input[type=password]:focus{outline:none;box-shadow:inset 0 0 0 2px var(--gr)}
input[aria-invalid="true"]{box-shadow:inset 0 0 0 2px var(--pk)}
button{height:50px;padding:0 26px;border:0;border-radius:999px;background:var(--gr);color:var(--dp);font-family:var(--font-h);font-size:1rem;font-weight:700;cursor:pointer}
button:hover{background:var(--wh)}
button:focus-visible{outline:2px solid var(--wh);outline-offset:3px}
.err{margin:12px 0 0;padding-left:12px;border-left:3px solid var(--pk);font-weight:700}
.motif{display:grid;grid-template-columns:repeat(6,clamp(26px,3.4vw,46px));gap:clamp(5px,.7vw,9px)}
.motif span{aspect-ratio:1;border-radius:50%;background:var(--pu)}
.motif .g{background:var(--gr)}
.motif .p{background:var(--pk)}
.foot{margin:clamp(40px,7vw,72px) 0 0;color:var(--md);font-size:.875rem}
[hidden]{display:none !important}
@media (max-width:760px){
  .main{grid-template-columns:1fr}
  .motif{order:-1;grid-template-columns:repeat(6,24px);gap:5px}
}
</style>
</head>
<body>
<div class="panel">
<main class="wrap">
  <span class="logo" role="img" aria-label="Ticketportal PLG"></span>
  <div class="main">
    <div>
      <p class="eyebrow">Sales tím</p>
      <h1>Kto je dnes v&nbsp;<em>kancelárii?</em></h1>
      <p class="sub">Prehľad home office a prítomnosti v kancelárii pre celý tím.</p>
      <form method="post" action="/api/login">
        <label for="pw">Tímové heslo</label>
        <div class="row">
          <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus aria-describedby="err">
          <button type="submit">Vstúpiť</button>
        </div>
        <input type="hidden" name="next" id="next" value="/">
        <p class="err" id="err" role="alert" hidden>Heslo nesedí. Skús to znova.</p>
      </form>
    </div>
    <div class="motif" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span class="g"></span><span></span><span></span><span></span><span class="p"></span><span></span><span></span><span></span></div>
  </div>
  <p class="foot">Heslo ti pošle vedúci tímu. Prehliadač si prihlásenie zapamätá na 30 dní.</p>
</main>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  if(q.get('chyba')){ document.getElementById('err').hidden = false; document.getElementById('pw').setAttribute('aria-invalid','true'); }
  var n = q.get('next') || '';
  if(n.charAt(0) === '/' && n.charAt(1) !== '/' && n.charAt(1) !== '\\') document.getElementById('next').value = n;
})();
</script>
</body>
</html>
